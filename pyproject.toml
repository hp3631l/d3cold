[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d3cold"
version = "1.0.0"
authors = [
  { name="hp3631l" }
]
description = "Diagnostics, auto-remediation, and zero-wake monitoring for NVIDIA hybrid graphics on Linux & Wayland"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Hardware",
    "Topic :: System :: Power Management",
]

[project.scripts]
d3cold = "dgpu_doctor.cli:main"
dgpu-doctor = "dgpu_doctor.cli:main"
